<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="#070b14" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" fill-opacity="0.85" />

  <!-- Global Latitude Ring / Talent Orb (angled) -->
  <ellipse cx="32" cy="32" rx="22" ry="11" transform="rotate(-25 32 32)" stroke="url(#ring)" stroke-width="2.5" stroke-opacity="0.7" fill="none" />
  
  <!-- Neural / Satellite Node -->
  <circle cx="16" cy="22" r="3" fill="#38bdf8" filter="url(#shadow)" />
  <circle cx="48" cy="42" r="3" fill="#c084fc" filter="url(#shadow)" />

  <!-- Claude AI Sparkle Star (Center) -->
  <path d="M32 14 C32 23.5 24 32 14 32 C24 32 32 40.5 32 50 C32 40.5 40 32 50 32 C40 32 32 23.5 32 14 Z" fill="url(#spark)" filter="url(#shadow)" />

  <!-- Center Core Node -->
  <circle cx="32" cy="32" r="3.5" fill="#38bdf8" />
  <circle cx="32" cy="32" r="1.5" fill="#ffffff" />
</svg>
